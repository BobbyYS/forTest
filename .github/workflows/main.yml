name: Taiwan Stock Scanner

on:
  schedule:
    # 星期一至五，UTC 03:00 (台灣 11:00) 與 UTC 09:00 (台灣 17:00)
    - cron: '0 3,9 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕觸發測試

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance twstock tqdm requests gspread oauth2client

      - name: Create Google Service Account JSON
        env:
          GCP_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          # 從 GitHub Secret 讀取內容並生成 json 檔案供程式讀取
          echo "$GCP_JSON" > service_account.json
          

      - name: Run Scanner Script
        env:
          # 將 GitHub Secrets 對應到程式環境變數
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py
